<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YNTN TOURS 3-A.B - リアルタイム受付・キャンセル管理</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#0b0f19] text-slate-100 min-h-screen flex flex-col selection:bg-amber-500 selection:text-black">

    <!-- ヘッダー -->
    <header class="bg-gradient-to-r from-blue-950 via-slate-900 to-blue-950 border-b border-amber-500/40 shadow-xl p-3 sm:p-4 sticky top-0 z-50">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <h1 class="text-base sm:text-xl font-extrabold tracking-widest text-transparent bg-clip-text bg-gradient-to-r from-amber-300 via-amber-400 to-yellow-200 drop-shadow-[0_2px_10px_rgba(245,158,11,0.3)]">
                YNTN TOURS 3-A.B
            </h1>
            <!-- スタッフ用URL(?admin=1)のときだけ運営モードボタンを表示 -->
            <div class="flex items-center gap-2">
                <button onclick="loadData()" class="text-xs bg-slate-800 hover:bg-slate-700 text-amber-300 border border-amber-500/30 px-2.5 py-1.5 rounded-lg shadow transition flex items-center gap-1">
                    <span>🔄</span> 更新
                </button>
                <div id="admin-mode-trigger" class="hidden">
                    <button onclick="switchTab('admin')" id="btn-admin" class="px-2.5 py-1 sm:px-3 sm:py-1.5 text-xs sm:text-sm bg-slate-800 text-amber-300 border border-amber-500/30 font-semibold rounded-lg shadow transition">運営モード</button>
                </div>
            </div>
        </div>
    </header>

    <!-- メインコンテンツ -->
    <main class="max-w-4xl mx-auto flex-1 w-full p-3 sm:p-4 space-y-4 sm:space-y-6">

        <!-- ================= お客さん画面 ================= -->
        <section id="view-customer" class="space-y-4 sm:space-y-6">
            <!-- 現在呼び出し中 -->
            <div class="bg-gradient-to-br from-blue-950 via-slate-900 to-[#070913] border-2 border-amber-500/50 rounded-2xl p-5 sm:p-6 text-center shadow-[0_0_30px_rgba(30,58,138,0.4)] relative overflow-hidden">
                <div class="absolute -top-10 -right-10 w-32 h-32 bg-amber-500/10 rounded-full blur-2xl pointer-events-none"></div>
                <h2 class="text-amber-400 text-xs font-bold uppercase tracking-[0.2em] mb-2 flex items-center justify-center gap-2">
                    <span>🚀</span> ただいまのご案内番号 <span>🚀</span>
                </h2>
                <div id="current-display" class="text-5xl sm:text-6xl font-black tracking-tight text-transparent bg-clip-text bg-gradient-to-b from-white via-slate-100 to-amber-200 my-2 sm:my-3 drop-shadow-md">----</div>
                <p id="current-msg" class="text-blue-200/80 text-xs sm:text-sm">まもなくご搭乗です。フライトゲートへお進みください！</p>
            </div>

            <!-- キャンセル・行けなくなったとき（直接入力版） -->
            <div class="bg-slate-900/90 border border-amber-500/30 rounded-2xl p-4 sm:p-5 shadow-lg relative">
                <h3 class="text-amber-400 text-sm sm:text-base font-bold mb-2 flex items-center gap-2">
                    <span>⚠️</span> フライト（時間）に行けなくなった方へ
                </h3>
                <p class="text-xs sm:text-sm text-slate-300 mb-3">予約した時間に行けなくなった場合は、自分の番号を直接入力してキャンセルボタンを押してください。次の宇宙飛行士に枠が譲られます。</p>
                <div class="flex flex-col sm:flex-row gap-2">
                    <input type="text" id="cancel-input" placeholder="例: 15" class="bg-slate-950 border border-amber-500/40 rounded-lg px-3 py-2 text-white text-sm sm:text-base flex-1 focus:outline-none focus:ring-2 focus:ring-amber-500">
                    <button onclick="requestCancel()" class="bg-gradient-to-r from-amber-500 to-yellow-600 hover:from-amber-400 hover:to-yellow-500 text-slate-950 font-extrabold px-4 py-2.5 sm:py-2 rounded-lg shadow-md transition text-sm sm:text-base">キャンセルする</button>
                </div>
            </div>

            <!-- 現在の状況一覧 -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div class="bg-slate-900/80 border border-blue-900/50 rounded-2xl p-4 sm:p-5 shadow">
                    <h3 class="text-blue-300 text-sm sm:text-base font-bold mb-3 flex items-center justify-between">
                        <span class="flex items-center gap-1.5">🌠 受付待ち・スタンバイ</span>
                        <span id="waiting-count" class="text-xs bg-blue-950 border border-blue-800 px-2.5 py-0.5 rounded-full text-blue-200">0件</span>
                    </h3>
                    <div id="waiting-list" class="flex flex-wrap gap-1.5 sm:gap-2 max-h-48 overflow-y-auto p-1">
                        <!-- 動的に生成 -->
                    </div>
                </div>

                <div class="bg-slate-900/80 border border-amber-900/50 rounded-2xl p-4 sm:p-5 shadow">
                    <h3 class="text-amber-500/90 text-sm sm:text-base font-bold mb-3 flex items-center justify-between">
                        <span class="flex items-center gap-1.5">🪐 キャンセル済み番号</span>
                        <span id="canceled-count" class="text-xs bg-amber-950/60 border border-amber-900/50 px-2.5 py-0.5 rounded-full text-amber-300">0件</span>
                    </h3>
                    <div id="canceled-list" class="flex flex-wrap gap-2 max-h-48 overflow-y-auto p-1">
                        <!-- 動的に生成 -->
                    </div>
                </div>
            </div>
        </section>

        <!-- ================= 運営モード ================= -->
        <section id="view-admin" class="space-y-4 sm:space-y-6 hidden">
            <div class="bg-slate-900 border border-blue-900/60 rounded-2xl p-4 sm:p-6 shadow-xl space-y-4 sm:space-y-6">
                <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2 border-b border-slate-800 pb-4">
                    <h2 class="text-base sm:text-lg font-bold text-amber-400">🛠️ クルー（運営スタッフ）用 コントロールパネル</h2>
                    <div class="flex items-center gap-2 w-full sm:w-auto justify-end">
                        <button onclick="switchTab('customer')" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 px-3 py-1.5 rounded transition">← お客さん画面に戻る</button>
                        <button onclick="resetData()" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-400 border border-slate-700 px-3 py-1.5 rounded transition">データをリセット</button>
                    </div>
                </div>

                <!-- まとめて番号を追加する便利ボタン -->
                <div class="bg-slate-950/60 p-3 sm:p-4 rounded-xl border border-slate-800 space-y-2">
                    <label class="text-xs sm:text-sm font-semibold text-blue-200">⚡ まるごと一括追加（おすすめ）</label>
                    <div class="flex flex-wrap gap-2">
                        <button onclick="addBatch(1, 50)" class="bg-blue-900 hover:bg-blue-800 text-blue-100 text-xs font-bold px-3 py-2 rounded border border-blue-700 flex-1 sm:flex-none">1〜50を追加</button>
                        <button onclick="addBatch(51, 100)" class="bg-blue-900 hover:bg-blue-800 text-blue-100 text-xs font-bold px-3 py-2 rounded border border-blue-700 flex-1 sm:flex-none">51〜100を追加</button>
                        <button onclick="addBatch(101, 150)" class="bg-blue-900 hover:bg-blue-800 text-blue-100 text-xs font-bold px-3 py-2 rounded border border-blue-700 flex-1 sm:flex-none">101〜150を追加</button>
                    </div>
                </div>

                <!-- 個別・自由な番号の追加 -->
                <div class="space-y-2">
                    <label class="text-xs sm:text-sm font-semibold text-blue-200">番号を個別・自由に指定して追加</label>
                    <div class="flex flex-col sm:flex-row gap-2">
                        <input type="text" id="add-number-input" placeholder="例: 1, 2, 3" class="bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-white text-sm sm:text-base flex-1 focus:outline-none focus:ring-2 focus:ring-amber-500">
                        <button onclick="addNumbers()" class="bg-gradient-to-r from-amber-500 to-yellow-600 text-slate-950 font-bold px-4 py-2.5 sm:py-2 rounded-lg shadow transition text-sm sm:text-base">追加する</button>
                    </div>
                </div>

                <!-- 次の番号を呼ぶ -->
                <div class="bg-blue-950/40 p-4 rounded-xl border border-blue-800/60 flex flex-col sm:flex-row items-center justify-between gap-3">
                    <div class="w-full sm:w-auto text-center sm:text-left">
                        <div class="text-xs text-blue-300">次に案内する搭乗番号</div>
                        <div id="next-preview" class="text-2xl font-bold text-amber-300">--</div>
                    </div>
                    <button onclick="callNext()" class="w-full sm:w-auto bg-gradient-to-r from-blue-600 to-blue-500 hover:from-blue-500 hover:to-blue-400 text-white font-bold px-6 py-3 rounded-xl shadow-lg transition flex items-center justify-center gap-2 border border-blue-400/30">
                        <span>📢 次の番号を呼ぶ</span>
                    </button>
                </div>

                <!-- 手動ステータス管理リスト -->
                <div class="space-y-2">
                    <label class="text-xs sm:text-sm font-semibold text-blue-200">全番号ステータス管理（キャンセル時刻も記録されます）</label>
                    <div id="admin-number-table" class="bg-slate-950 border border-slate-800 rounded-xl p-3 max-h-60 overflow-y-auto space-y-2">
                        <!-- 動的生成 -->
                    </div>
                </div>
            </div>
        </section>

    </main>

    <footer class="text-center py-4 text-xs text-slate-500 border-t border-slate-900 mt-auto">
        YNTN TOURS 3-A.B Flight Control System
    </footer>

    <!-- JavaScript 制御ロジック -->
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('admin') === '1') {
            document.getElementById('admin-mode-trigger').classList.remove('hidden');
        }

        let appData = {
            current: '未設定',
            waiting: [],
            canceled: [] // 形式: [{num: '15', time: '14:32'}]
        };

        function getCurrentTimeString() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            return `${hours}:${minutes}`;
        }

        function loadData() {
            const saved = localStorage.getItem('yntn_tours_data');
            if (saved) {
                appData = JSON.parse(saved);
                // データの形式をチェックし、古い形式（文字列のまま）なら現在の時間を補う
                if (appData.canceled.length > 0 && typeof appData.canceled[0] === 'string') {
                    const currentTime = getCurrentTimeString();
                    appData.canceled = appData.canceled.map(num => ({ num: num, time: currentTime }));
                    saveData();
                }
            }
            updateUI();
        }

        function saveData() {
            localStorage.setItem('yntn_tours_data', JSON.stringify(appData));
            updateUI();
        }

        function switchTab(tab) {
            const customerView = document.getElementById('view-customer');
            const adminView = document.getElementById('view-admin');

            if (tab === 'customer') {
                customerView.classList.remove('hidden');
                adminView.classList.add('hidden');
            } else {
                customerView.classList.add('hidden');
                adminView.classList.remove('hidden');
            }
        }

        function updateUI() {
            document.getElementById('current-display').textContent = appData.current;

            const waitingListEl = document.getElementById('waiting-list');
            waitingListEl.innerHTML = '';

            if (appData.waiting.length === 0) {
                waitingListEl.innerHTML = '<span class="text-xs text-slate-500">待ち番号はありません（スタッフが追加するまでお待ちください）</span>';
            } else {
                appData.waiting.forEach(num => {
                    const badge = document.createElement('span');
                    badge.className = "bg-blue-950 text-blue-200 px-2.5 py-1 rounded-lg text-xs sm:text-sm font-bold border border-blue-800/60 shadow-sm";
                    badge.textContent = num;
                    waitingListEl.appendChild(badge);
                });
            }
            document.getElementById('waiting-count').textContent = appData.waiting.length + '件';

            const canceledListEl = document.getElementById('canceled-list');
            canceledListEl.innerHTML = '';
            if (appData.canceled.length === 0) {
                canceledListEl.innerHTML = '<span class="text-xs text-slate-500">キャンセルはありません</span>';
            } else {
                appData.canceled.forEach(item => {
                    const badge = document.createElement('div');
                    badge.className = "bg-amber-950/60 text-amber-300 px-3 py-1.5 rounded-lg text-xs sm:text-sm font-bold border border-amber-900/60 shadow-sm flex items-center justify-between gap-3";
                    badge.innerHTML = `<span>No. ${item.num}</span><span class="text-xs text-amber-200 font-mono bg-amber-900/50 px-2 py-0.5 rounded">🕒 ${item.time || '--:--'}</span>`;
                    canceledListEl.appendChild(badge);
                });
            }
            document.getElementById('canceled-count').textContent = appData.canceled.length + '件';

            document.getElementById('next-preview').textContent = appData.waiting.length > 0 ? appData.waiting[0] : 'なし';

            const adminTable = document.getElementById('admin-number-table');
            if (adminTable) {
                adminTable.innerHTML = '';
                
                const canceledNums = appData.canceled.map(item => item.num);
                const allNums = [...appData.waiting, ...canceledNums];

                if (allNums.length === 0) {
                    adminTable.innerHTML = '<div class="text-xs text-slate-500 p-2">登録されている番号はありません</div>';
                } else {
                    allNums.sort((a, b) => Number(a) - Number(b)).forEach(num => {
                        const isCanceled = canceledNums.includes(num);
                        const canceledItem = appData.canceled.find(item => item.num === num);
                        const timeStr = isCanceled && canceledItem ? `キャンセル時刻: ${canceledItem.time || '--:--'}` : '';

                        const row = document.createElement('div');
                        row.className = "flex flex-col sm:flex-row justify-between items-start sm:items-center bg-slate-900 p-2.5 rounded-lg border border-slate-800 text-sm gap-2";
                        row.innerHTML = `
                            <div>
                                <span class="font-bold text-white">${num}番</span>
                                <span class="text-xs text-amber-400 ml-2 font-mono">${timeStr}</span>
                            </div>
                            <div class="flex items-center gap-1.5 w-full sm:w-auto justify-end">
                                <span class="text-xs px-2 py-1 rounded ${isCanceled ? 'bg-amber-950 text-amber-300 border border-amber-800/50' : 'bg-blue-950 text-blue-300 border border-blue-800/50'}">
                                    ${isCanceled ? 'キャンセル済み' : '受付待ち'}
                                }</span>
                                <button onclick="toggleStatus('${num}')" class="text-xs bg-slate-800 hover:bg-slate-700 px-2.5 py-1 rounded text-slate-300 border border-slate-700">切替</button>
                                <button onclick="removeNumber('${num}')" class="text-xs bg-rose-950 hover:bg-rose-900 px-2.5 py-1 rounded text-rose-300 border border-rose-900/50">消す</button>
                            </div>
                        `;
                        adminTable.appendChild(row);
                    });
                }
            }
        }

        function requestCancel() {
            loadData();
            const input = document.getElementById('cancel-input');
            const target = input.value.trim();
            if (!target) {
                alert('キャンセルする番号を入力してください。（例: 15）');
                return;
            }

            if (!appData.waiting.includes(target)) {
                alert(`${target}番は現在の待ちリストに見つかりませんでした。\n\n※まだスタッフが番号を追加していないか、すでに呼び出し済みの可能性があります。`);
                return;
            }

            if (confirm(`${target}番をキャンセル扱いにしますか？`)) {
                const timeString = getCurrentTimeString();

                appData.waiting = appData.waiting.filter(n => n !== target);
                
                if (!appData.canceled.some(item => item.num === target)) {
                    appData.canceled.push({ num: target, time: timeString });
                }
                
                input.value = '';
                saveData();
                alert(`${target}番のキャンセルを受け付けました（${timeString}）。ご協力ありがとうございます！`);
            }
        }

        function callNext() {
            loadData();
            if (appData.waiting.length === 0) {
                alert('呼べる番号がもうありません！');
                return;
            }
            const nextNum = appData.waiting.shift();
            appData.current = nextNum;
            saveData();
        }

        function addBatch(start, end) {
            loadData();
            for (let i = start; i <= end; i++) {
                const n = String(i);
                const isCanceled = appData.canceled.some(item => item.num === n);
                if (!appData.waiting.includes(n) && !isCanceled && appData.current !== n) {
                    appData.waiting.push(n);
                }
            }
            saveData();
            alert(`${start}番〜${end}番を追加しました！`);
        }

        function addNumbers() {
            loadData();
            const input = document.getElementById('add-number-input');
            const val = input.value.trim();
            if (!val) return;

            const nums = val.split(',').map(s => s.trim()).filter(s => s !== '');
            nums.forEach(n => {
                const isCanceled = appData.canceled.some(item => item.num === n);
                if (!appData.waiting.includes(n) && !isCanceled) {
                    appData.waiting.push(n);
                }
            });
            input.value = '';
            saveData();
        }

        function toggleStatus(num) {
            loadData();
            if (appData.waiting.includes(num)) {
                appData.waiting = appData.waiting.filter(n => n !== num);
                const timeString = getCurrentTimeString();
                appData.canceled.push({ num: num, time: timeString });
            } else {
                appData.canceled = appData.canceled.filter(item => item.num !== num);
                appData.waiting.push(num);
            }
            saveData();
        }

        window.removeNumber = function(num) {
            loadData();
            if (confirm(`${num}番をリストから削除しますか？`)) {
                appData.waiting = appData.waiting.filter(n => n !== num);
                appData.canceled = appData.canceled.filter(item => item.num !== num);
                if (appData.current === num) appData.current = '未設定';
                saveData();
            }
        }

        function resetData() {
            if (confirm('すべてのデータをリセットしますか？')) {
                appData = { current: '未設定', waiting: [], canceled: [] };
                saveData();
            }
        }

        window.addEventListener('storage', (e) => {
            if (e.key === 'yntn_tours_data') {
                loadData();
            }
        });

        setInterval(loadData, 1000);
        loadData();
    </script>
</body>
</html>
